# Publie l'appli sur GitHub Pages à chaque envoi sur la branche main.
# Seuls les fichiers de l'appli sont mis en ligne (pas le banc de test).
name: Publier Lis-moi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers de l'appli
        run: |
          mkdir _site
          cp index.html ocr.js phrases.js voix.js voix-worker.js sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp -r vendor _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
